<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลส่วนตัว - โชคดีล็อตเตอรี่</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; padding: 20px; }
    .container { max-width: 450px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #0056b3; }
    .status-msg { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; padding: 8px; background: #e9ecef; border-radius: 6px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input[type="text"], input[type="tel"], textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
    textarea { height: 80px; }
    button { width: 100%; padding: 12px; background-color: #28a745; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .loading { text-align: center; font-weight: bold; color: #007bff; padding: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>👤 ข้อมูลส่วนตัวสมาชิก</h2>
  <div id="status" class="status-msg">กำลังเชื่อมต่อ LINE LIFF...</div>
  <div id="loadingBlock" class="loading">⏳ กำลังเช็คประวัติข้อมูลเดิมของคุณ...</div>

  <form id="profileForm" style="display: none;">
    <input type="hidden" id="lineUserId">
    <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="fullName" required></div>
    <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="phone" required></div>
    <div class="form-group"><label>ที่อยู่จัดส่งสลากใบจริง</label><textarea id="address" required></textarea></div>
    <div class="form-group"><label>ธนาคารของคุณ (สำหรับรับเงินรางวัล)</label><input type="text" id="bankName"></div>
    <div class="form-group"><label>เลขที่บัญชีธนาคาร</label><input type="text" id="bankAccount"></div>
    <button type="submit">💾 บันทึกข้อมูลโปรไฟล์</button>
  </form>
</div>

<script>
  // 🔴 แก้ไข: ใส่ URL Web App ของคุณ
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyRH19EglScAhTxLYgEb9hkT5sUPzeIQ9hviJgK6zjffE88Zky24I5Lrgo72OwR3tICnQ/exec"; 
  // 🔴 แก้ไข: ใส่ LIFF ID ของหน้าค้นหาเลขเด็ด
  const LIFF_ID = "2010122368-FLjBLYl5"; 

  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const profile = await liff.getProfile();
      document.getElementById("lineUserId").value = profile.userId;
      document.getElementById("status").innerText = "สวัสดีคุณ " + profile.displayName;

      // ส่ง ID ไปดึงข้อมูลสมาชิกเก่า
      const response = await fetch(`${BACKEND_URL}?action=getProfile&lineUserId=${profile.userId}`);
      const result = await response.json();

      document.getElementById("loadingBlock").style.display = "none";
      document.getElementById("profileForm").style.display = "block";

      if (result.status === "found") {
        document.getElementById("fullName").value = result.data.fullName || "";
        document.getElementById("phone").value = result.data.phone || "";
        document.getElementById("address").value = result.data.address || "";
        document.getElementById("bankName").value = result.data.bankName || "";
        document.getElementById("bankAccount").value = result.data.bankAccount || "";
        document.getElementById("status").innerText = "⚙️ โหลดข้อมูลเดิมของคุณเรียบร้อย แก้ไขได้เลยครับ";
      } else {
        document.getElementById("status").innerText = "✨ ไม่พบข้อมูลเดิม ยินดีต้อนรับสมาชิกใหม่ครับ!";
      }
    } catch (error) {
      document.getElementById("status").innerText = "❌ การเชื่อมต่อระบบลีฟผิดพลาด";
    }
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = {
      lineUserId: document.getElementById("lineUserId").value,
      fullName: document.getElementById("fullName").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      bankName: document.getElementById("bankName").value,
      bankAccount: document.getElementById("bankAccount").value
    };
    try {
      const response = await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({ action: "saveProfile", data: formData }) });
      const resData = await response.json();
      alert(resData.message);
      liff.closeWindow();
    } catch (err) {
      alert("❌ บันทึกข้อมูลไม่สำเร็จ");
    }
  });
  window.onload = initLiff;
</script>
</body>
</html>
