<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลส่วนตัว - โชคดีล็อตเตอรี่</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #0056b3; margin-top: 0; font-size: 22px; }
    .status-msg { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; padding: 8px; background: #e9ecef; border-radius: 6px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #495057; }
    input[type="text"], input[type="tel"], textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    textarea { height: 80px; resize: none; }
    input:focus, textarea:focus { border-color: #80bdff; outline: 0; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); }
    button { width: 100%; padding: 12px; background-color: #28a745; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background-color: #218838; }
    .loading { text-align: center; font-size: 16px; color: #007bff; font-weight: bold; padding: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>👤 ข้อมูลส่วนตัวลูกค้า</h2>
  <div id="status" class="status-msg">กำลังเชื่อมต่อระบบ LINE...</div>
  
  <div id="loadingBlock" class="loading">⏳ กำลังดึงข้อมูลเดิมของคุณ...</div>

  <form id="profileForm" style="display: none;">
    <input type="hidden" id="lineUserId">
    
    <div class="form-group">
      <label for="fullName">ชื่อ-นามสกุล (สำหรับจัดส่ง/ขึ้นเงิน)</label>
      <input type="text" id="fullName" placeholder="นายโชคดี ร่ำรวย" required>
    </div>
    
    <div class="form-group">
      <label for="phone">เบอร์โทรศัพท์</label>
      <input type="tel" id="phone" placeholder="08XXXXXXXX" required>
    </div>
    
    <div class="form-group">
      <label for="address">ที่อยู่สำหรับจัดส่งใบจริง</label>
      <textarea id="address" placeholder="บ้านเลขที่, ถนน, แขวง/ตำบล, เขต/อำเภอ, จังหวัด, รหัสไปรษณีย์" required></textarea>
    </div>
    
    <div class="form-group">
      <label for="bankName">ธนาคารของคุณ (กรณีถูกรางวัลให้โอนเข้าบัญชีนี้)</label>
      <input type="text" id="bankName" placeholder="กสิกรไทย, ไทยพาณิชย์ ฯลฯ">
    </div>
    
    <div class="form-group">
      <label for="bankAccount">เลขที่บัญชีธนาคาร</label>
      <input type="text" id="bankAccount" placeholder="XXX-X-XXXXX-X">
    </div>
    
    <button type="submit">💾 บันทึกข้อมูลส่วนตัว</button>
  </form>
</div>

<script>
  // 🔴 เปลี่ยนจุดนี้: นำ URL ของ Web App (Apps Script ตัวล่าสุดหลังจาก Deploy) มาวางแทนที่นี่ครับ
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzWqbq3JfJVNSzt7vRK1A6zp8LTvunvoSIsHOHgAorRgJsVgCCMxi6ntfWRn2LFTInqSA/exec"; 
  // 🔴 เปลี่ยนจุดนี้: นำ LIFF ID จากหน้า LINE Developers มาใส่ตรงนี้ครับ
  const LIFF_ID = "2010122368-FLjBLYl5"; 

  async function initLiff() {
    try {
      // 1. ลงชื่อเข้าใช้งาน LIFF และสกัดดึงข้อมูลผู้ใช้ไลน์
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      
      const profile = await liff.getProfile();
      const userId = profile.userId;
      document.getElementById("lineUserId").value = userId;
      document.getElementById("status").innerText = "สวัสดีคุณ " + profile.displayName;

      // 2. ส่ง LINE User ID ไปค้นหาข้อมูลประวัติเดิมที่ฐานข้อมูลหลังบ้าน
      const response = await fetch(`${BACKEND_URL}?action=getProfile&lineUserId=${userId}`);
      const result = await response.json();

      // 3. จัดการแสดงผลข้อมูล
      document.getElementById("loadingBlock").style.display = "none";
      document.getElementById("profileForm").style.display = "block";

      if (result.status === "found") {
        // หากเจอประวัติเก่า ระบบจะทำการเทค่าเดิมลงกล่องกรอกข้อมูลแต่ละช่องให้ลูกค้าเห็นทันที
        document.getElementById("fullName").value = result.data.fullName || "";
        document.getElementById("phone").value = result.data.phone || "";
        document.getElementById("address").value = result.data.address || "";
        document.getElementById("bankName").value = result.data.bankName || "";
        document.getElementById("bankAccount").value = result.data.bankAccount || "";
        document.getElementById("status").innerText = "⚙️ ตรวจพบประวัติเก่าของคุณ สามารถแก้ไขและบันทึกทับได้เลยครับ";
      } else {
        document.getElementById("status").innerText = "✨ ตรวจพบคุณเป็นลูกค้าใหม่ ยินดีต้อนรับครับ!";
      }

    } catch (error) {
      console.error("ระบบทำงานผิดพลาด:", error);
      document.getElementById("status").innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบลีฟ";
    }
  }

  // ตัวตรวจจับคำสั่งตอนกดปุ่มเซฟ "บันทึกข้อมูลส่วนตัว"
  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("status").innerText = "⏳ กำลังบันทึกข้อมูลของคุณลงฐานข้อมูล...";
    
    const formData = {
      lineUserId: document.getElementById("lineUserId").value,
      fullName: document.getElementById("fullName").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      bankName: document.getElementById("bankName").value,
      bankAccount: document.getElementById("bankAccount").value
    };

    try {
      // ส่งคำสั่งแบบ POST ไปที่หลังบ้านในฟังก์ชัน saveCustomerProfile ตัวเดิมเพื่ออัปเดตทับหรือบันทึกใหม่
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        body: JSON.stringify({ action: "saveProfile", data: formData })
      });
      const resData = await response.json();
      
      alert(resData.message); // โชว์ Alert แจ้งผลความสำเร็จ
      liff.closeWindow();    // สั่งปิดหน้าจอเบราว์เซอร์ลีฟบนไลน์อัตโนมัติ
    } catch (err) {
      alert("❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
      document.getElementById("status").innerText = "❌ บันทึกข้อมูลไม่สำเร็จ";
    }
  });

  window.onload = initLiff;
</script>
</body>
</html>
