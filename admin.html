<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>แอดมิน - โชคดีล็อตเตอรี่</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Sarabun", "Tahoma", sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #e84a4a; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { flex: 1; padding: 10px; border: 0; border-radius: 8px; background: #dde3e8; font-size: 15px; cursor: pointer; }
  .tabs button.active { background: #e84a4a; color: #fff; }
  .tabs .cnt { display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px; border-radius: 12px; background: #e84a4a; color: #fff; font-size: 13px; font-weight: bold; }
  .tabs button.active .cnt { background: #fff; color: #e84a4a; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 4px 0; font-size: 14px; }
  .muted { color: #777; font-size: 13px; }
  .amount { font-weight: bold; color: #c0392b; font-size: 18px; }
  .btn { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; color: #fff; background: #2e8b57; }
  .btn.red { background: #c0392b; } .btn.gray { background: #6c757d; } .btn.blue { background: #2f6fd1; }
  .btn:disabled { opacity: .5; cursor: wait; }
  input, select { padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; width: 100%; }
  #loginBox { max-width: 360px; margin: 60px auto; }
  #loginBox input { margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 6px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  .readonly { color: #555; }
  .msg { margin: 8px 0; font-size: 14px; }
  .err { color: #c0392b; } .ok { color: #2e8b57; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #fff3cd; font-size: 12px; }
  dialog { border: 0; border-radius: 12px; padding: 20px; width: min(95vw, 600px); }
  dialog::backdrop { background: #0008; }
  dialog label { display: block; margin: 12px 0; }
  textarea { width: 100%; min-height: 80px; font: inherit; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>🔐 หลังบ้านแอดมิน</h1>
  <span id="roleLabel" style="display:none"></span>
  <button class="btn gray" id="logoutBtn" style="display:none" onclick="logout()">ออกจากระบบ</button>
</header>

<div id="loginBox" class="card">
  <h3>เข้าสู่ระบบแอดมิน</h3>
  <input type="password" id="pw" placeholder="รหัสผ่านแอดมิน" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn blue" style="width:100%" onclick="login()">เข้าสู่ระบบ</button>
  <div class="msg err" id="loginMsg"></div>
</div>

<main id="app" style="display:none">
  <div class="tabs">
    <button data-tab="wallet" class="active" onclick="showTab('wallet')">💰 ฝาก / ถอน<span class="cnt" id="cnt-wallet" style="display:none"></span></button>
    <button data-tab="shipping" onclick="showTab('shipping')">📦 จัดส่งสลาก<span class="cnt" id="cnt-shipping" style="display:none"></span></button>
    <button data-tab="settings" onclick="showTab('settings')">⚙️ ตั้งค่า</button>
    <button data-tab="manage" onclick="showTab('manage')">🏪 จัดการร้าน</button>
  </div>
  <div class="msg" id="globalMsg"></div>
  <section id="tab-wallet"></section>
  <section id="tab-shipping" style="display:none"></section>
  <section id="tab-settings" style="display:none"></section>
  <section id="tab-manage" style="display:none"></section>
</main>

<dialog id="slipEditDialog" aria-labelledby="slipEditTitle">
  <h3 id="slipEditTitle">แก้ไขการผูกสลิป</h3>
  <div id="slipEditInfo"></div>
  <form onsubmit="event.preventDefault();saveSlipLink()">
    <label>คำขอปลายทาง<select id="slipTarget"></select></label>
    <label>เหตุผล (5–500 ตัวอักษร)<textarea id="slipReason" required minlength="5" maxlength="500"></textarea></label>
    <div class="muted">เปลี่ยนเฉพาะการผูกสลิป ไม่เปลี่ยนยอดเงิน ไม่อนุมัติ และไม่ตรวจ EasySlip ซ้ำ</div>
    <div id="slipEditMsg" class="msg err" role="alert"></div>
    <button id="slipSaveBtn" class="btn blue" type="submit">บันทึกการผูกสลิป</button>
    <button id="slipCancelBtn" class="btn gray" type="button" onclick="$('slipEditDialog').close()">ยกเลิก</button>
  </form>
</dialog>

<script src="config.js?v=65"></script>
<script>
  const TOKEN_KEY = "adminToken";
  let adminRole = null;
  let currentTab = "wallet";

  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function $(id) { return document.getElementById(id); }
  function setMsg(text, ok) {
    const el = $("globalMsg"); el.textContent = text || ""; el.className = "msg " + (ok ? "ok" : "err");
    if (ok && typeof refreshCounts === "function") setTimeout(refreshCounts, 1500);
  }

  async function api(action, fields = {}) {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      body: JSON.stringify({ action, adminToken: sessionStorage.getItem(TOKEN_KEY) || "", ...fields })
    });
    let result;
    try { result = JSON.parse(await res.text()); } catch (e) { throw new Error("Backend ตอบกลับไม่ถูกต้อง"); }
    if (result.code === "ADMIN_AUTH") { showLogin("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"); throw new Error(result.message); }
    return result;
  }

  function showLogin(message) {
    sessionStorage.removeItem(TOKEN_KEY);
    adminRole = null;
    $("roleLabel").style.display = "none";
    $("loginBox").style.display = "block"; $("app").style.display = "none"; $("logoutBtn").style.display = "none";
    $("loginMsg").textContent = message || "";
  }
  function showApp() {
    $("roleLabel").textContent = adminRole === "full" ? "สิทธิ์เต็ม" : "ฝาก/ถอน: ดูอย่างเดียว";
    $("roleLabel").style.display = "inline";
    $("loginBox").style.display = "none"; $("app").style.display = "block"; $("logoutBtn").style.display = "inline-block";
    showTab(currentTab); startCountPolling();
  }

  let countTimer = null, lastCounts = null;
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); g.gain.value = 0.1; o.frequency.value = 880; o.start(); o.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }
  async function refreshCounts() {
    if (!sessionStorage.getItem(TOKEN_KEY) || document.hidden) return;
    try {
      const r = await api("adminGetCounts");
      if (r.status !== "success") return;
      ["wallet", "shipping"].forEach(k => {
        const el = $("cnt-" + k); el.textContent = r[k]; el.style.display = r[k] > 0 ? "inline-block" : "none";
      });
      if (lastCounts && (r.wallet > lastCounts.wallet || r.shipping > lastCounts.shipping)) beep();
      lastCounts = { wallet: r.wallet, shipping: r.shipping };
      document.title = (r.wallet + r.shipping > 0 ? "(" + (r.wallet + r.shipping) + ") " : "") + "แอดมิน";
    } catch (e) {}
  }
  function startCountPolling() {
    if (countTimer) clearInterval(countTimer);
    lastCounts = null; refreshCounts();
    countTimer = setInterval(refreshCounts, 15000);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshCounts(); });

  async function login() {
    $("loginMsg").textContent = "";
    try {
      const r = await api("adminLogin", { password: $("pw").value });
      if (r.status !== "success") { $("loginMsg").textContent = r.message || "เข้าสู่ระบบไม่สำเร็จ"; return; }
      sessionStorage.setItem(TOKEN_KEY, r.token); adminRole = r.role; $("pw").value = ""; showApp();
    } catch (e) { $("loginMsg").textContent = e.message; }
  }
  async function logout() {
    try { await api("adminLogout"); } catch (e) {}
    showLogin("");
  }

  function showTab(name) {
    currentTab = name; setMsg("");
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    ["wallet", "shipping", "settings", "manage"].forEach(t => $("tab-" + t).style.display = t === name ? "block" : "none");
    ({ wallet: loadWallet, shipping: loadShipping, settings: loadSettings, manage: loadManage })[name]();
  }

  // ---------- จัดการร้าน ----------
  function loadManage() {
    const box = $("tab-manage");
    if (box.dataset.ready) return;
    box.dataset.ready = "1";
    box.innerHTML = `
      <div class="card"><h3>1. ดึงผลรางวัล</h3>
        <div class="muted" style="margin-bottom:6px">เลือกวันที่งวด ระบบอ่าน DrawResultsCache ก่อน หากไม่มีจึงดึงจาก Sanook แล้วบันทึกไว้ร่วมกับแอป ไม่ใช้ AI อ่านผลรางวัล</div>
        <label for="resultDrawDate">วันที่งวด (ค.ศ.)</label>
        <input id="resultDrawDate" type="date" required>
        <div style="margin-top:8px"><button class="btn blue" onclick="manageAct(this,'adminFetchResults',{drawDate:$('resultDrawDate').value},'mgFetch')">📥 ดึงผลรางวัล</button></div>
        <div class="msg" id="mgFetch"></div></div>
      <div class="card"><h3>2. ตรวจผลรางวัลในแผง</h3>
        <div class="muted" style="margin-bottom:6px">ตรวจสลากที่ยังรอการออกรางวัลทุกใบกับ DrawResultsCache เท่านั้น งวดที่ยังไม่มีผลจะคงสถานะรอ กรุณาดึงผลของงวดนั้นก่อน</div>
        <button class="btn" onclick="manageAct(this,'adminCheckPrizes',{},'mgCheck')">🔍 ตรวจผลรางวัล</button>
        <div class="msg" id="mgCheck"></div></div>
      <div class="card"><h3>3. อัพเดทหวยเข้าระบบ</h3>
        <div class="muted" style="margin-bottom:6px">นำเข้ารูปจากโฟลเดอร์ "หวยรอลงระบบ" แล้วย้ายไปโฟลเดอร์ "หวยในระบบ" (ไม่เปลี่ยนชื่อไฟล์) อาจใช้เวลาหลายนาที</div>
        <button class="btn" id="mgImportBtn" onclick="importTickets(this)">⚡ อัพเดทหวยเข้าระบบ</button>
        <div id="mgImportBar" style="display:none;margin-top:10px;background:#e5e7eb;border-radius:8px;overflow:hidden;height:22px">
          <div id="mgImportFill" style="height:100%;width:0;background:#16a34a;color:#fff;font-size:13px;text-align:center;line-height:22px;transition:width .3s">0%</div></div>
        <div class="msg" id="mgImport"></div></div>`;
  }
  async function importTickets(btn) {
    const el = $("mgImport"), bar = $("mgImportBar"), fill = $("mgImportFill");
    const setPct = p => { p = Math.max(0, Math.min(100, Math.round(p))); fill.style.width = p + "%"; fill.textContent = p + "%"; };
    btn.disabled = true; bar.style.display = "block"; setPct(0);
    el.className = "msg muted"; el.textContent = "⏳ กำลังนับรูปในโฟลเดอร์หวยรอลงระบบ...";
    const sum = { imported: 0, duplicates: 0, failed: 0 };
    let total = 0, handled = 0, error = "";
    try {
      const c = await api("adminImportCount");
      if (c.status !== "success") throw new Error(c.message);
      total = c.total;
      if (!total) { setPct(100); el.className = "msg ok"; el.textContent = "✅ ไม่มีรูปในโฟลเดอร์หวยรอลงระบบ"; btn.disabled = false; return; }
      while (handled < total) {
        el.className = "msg muted";
        el.textContent = "⏳ กำลังนำเข้า " + handled + " / " + total + " รูป... อย่าปิดหน้านี้";
        const r = await api("adminImportTickets");
        if (r.status !== "success") { error = r.message; break; }
        const n = (r.imported || 0) + (r.duplicates || 0) + (r.failed || 0);
        sum.imported += r.imported || 0; sum.duplicates += r.duplicates || 0; sum.failed += r.failed || 0;
        handled += n;
        setPct(handled / total * 100);
        if (!r.more || n === 0) break;
      }
    } catch (e) { error = e.message; }
    if (!error) setPct(100);
    el.className = "msg " + (error ? "err" : "ok");
    el.textContent = (error ? "❌ หยุดทำงาน: " + error + "\n" : "✅ ดำเนินการเสร็จสิ้น\n") +
      "สรุป: รูปทั้งหมด " + total + " รูป | นำเข้าสำเร็จ " + sum.imported + " ใบ | รูปซ้ำ " + sum.duplicates + " ใบ | อ่านไม่สำเร็จ " + sum.failed + " รูป" +
      (handled < total && !error ? " | เหลืออีก " + (total - handled) + " รูป (กดอัพเดทอีกครั้ง)" : "");
    el.style.whiteSpace = "pre-line";
    btn.disabled = false;
  }
  async function manageAct(btn, action, fields, msgId) {
    const el = $(msgId);
    if (action === "adminFetchResults" && (!/^\d{4}-\d{2}-\d{2}$/.test(fields.drawDate || "") || !$("resultDrawDate").checkValidity())) {
      el.className = "msg err"; el.textContent = "กรุณาเลือกวันที่งวดให้ถูกต้อง"; return;
    }
    btn.disabled = true; el.className = "msg muted"; el.textContent = "⏳ กำลังดำเนินการ... กรุณารอ อย่าปิดหน้านี้";
    try {
      const r = await api(action, fields);
      el.className = "msg " + (r.status === "success" ? "ok" : "err");
      el.textContent = (r.status === "success" ? "✅ " : "❌ ") + (r.message || "");
    } catch (e) { el.className = "msg err"; el.textContent = e.message; }
    btn.disabled = false;
  }

  // ---------- ฝาก / ถอน ----------
  let walletData = { deposits: [], withdrawals: [] };
  let editableSlips = [];
  let selectedSlip = null;
  let slipSaving = false;
  function slipEditButton(slip, editable) {
    if (adminRole !== "full" || !editable || !slip.messageId ||
        slip.cleanup || (slip.verification && ["CHECKING", "CREDITED"].includes(slip.verification.state))) return "";
    const index = editableSlips.push(slip) - 1;
    return `<button class="btn blue" type="button" onclick="openSlipEditor(${index})">แก้ไขการผูกสลิป</button>`;
  }
  function openSlipEditor(index) {
    if (adminRole !== "full" || slipSaving) return setMsg("ไม่มีสิทธิ์แก้ไข หรือกำลังบันทึก");
    const slip = editableSlips[index];
    if (!slip) return setMsg("ไม่พบสลิป กรุณาโหลดรายการใหม่");
    selectedSlip = { ...slip };
    const verification = slip.verification || {};
    $("slipEditInfo").textContent = `สมาชิก ${slip.memberNumber} | รับสลิป ${slip.time} | ยอด ${verification.amount ?? "ไม่ทราบ"} บาท | โอน ${verification.date || "ไม่ทราบ"} | อ้างอิง ${verification.ref || "ไม่มี"} | คำขอเดิม ${slip.txId || "ยังไม่ผูก"}`;
    const targets = walletData.deposits.filter(d => d.memberNumber === slip.memberNumber &&
      d.status === "รอตรวจสอบ" && !d.recoveryAvailable && d.txId !== slip.txId);
    $("slipTarget").innerHTML = '<option value="">แยกออก — เก็บไว้ในสลิปยังไม่ผูก (ไม่เติมเครดิต)</option>' +
      targets.map(d => `<option value="${esc(d.txId)}">${esc(d.txId)} | ${esc(d.netAmount)} บาท | ${esc(d.time)}</option>`).join("");
    $("slipReason").value = "";
    $("slipEditMsg").textContent = "";
    $("slipSaveBtn").disabled = false;
    $("slipCancelBtn").disabled = false;
    $("slipEditDialog").showModal();
  }
  async function saveSlipLink() {
    if (adminRole !== "full" || !selectedSlip || slipSaving) return;
    const reason = $("slipReason").value.trim();
    if (reason.length < 5 || reason.length > 500) {
      $("slipEditMsg").textContent = "กรุณาระบุเหตุผล 5–500 ตัวอักษร"; return;
    }
    const targetTxId = $("slipTarget").value;
    if (!selectedSlip.txId && !targetTxId) {
      $("slipEditMsg").textContent = "สลิปยังไม่ผูก กรุณาเลือกคำขอปลายทาง"; return;
    }
    if (!confirm(`ยืนยัน${targetTxId ? "ย้ายไป " + targetTxId : "แยกสลิปออกจากคำขอ"}? ไม่ได้เติมเครดิต`)) return;
    slipSaving = true;
    $("slipSaveBtn").disabled = $("slipCancelBtn").disabled = true;
    try {
      const r = await api("adminEditSlipLink", {
        messageId: selectedSlip.messageId, expectedTxId: selectedSlip.txId || "", targetTxId, reason
      });
      if (r.status !== "success") { $("slipEditMsg").textContent = r.message; return; }
      $("slipEditDialog").close();
      selectedSlip = null;
      setMsg(r.message, true);
      await loadWallet();
    } catch (e) { $("slipEditMsg").textContent = e.message; }
    finally {
      slipSaving = false;
      $("slipSaveBtn").disabled = $("slipCancelBtn").disabled = false;
    }
  }
  async function loadWallet() {
    const box = $("tab-wallet"); box.innerHTML = "<div class='muted'>กำลังโหลด...</div>";
    try {
      const r = await api("adminGetWallet"); walletData = r;
      if (r.status !== "success") { box.innerHTML = ""; return setMsg(r.message); }
      editableSlips = [];
      let html = `<details class="card"><summary>คู่มือจัดการสลิป / แก้สลิปผูกผิดคำขอ</summary>
        <ol><li>เปิดสลิป เทียบเวลาโอน ยอด และเลขอ้างอิงกับเงินเข้าจริงก่อนเสมอ</li>
        <li>กด “แก้ไขการผูกสลิป” ที่สลิปผิด เลือกแยกออก หรือย้ายไปคำขอรอตรวจของสมาชิกคนเดิม แล้วระบุเหตุผล</li>
        <li>สลิปที่แยกออกจะอยู่ด้านล่างและไม่ถูกลูกค้าผูกกลับอัตโนมัติ สามารถกดแก้ไขเพื่อผูกใหม่โดยแอดมินได้</li>
        <li>หลังแก้ ให้ตรวจสลิปที่เหลือและประวัติว่าไม่เคยเติมเครดิต แล้วกดอนุมัติแยกต่างหาก การแก้การผูกไม่เติมเครดิตและไม่เปลี่ยนผล EasySlip เก่า</li>
        <li>กรณี 00:37 กับ 01:43 ผูกคำขอเดียว ให้แยกสลิป 00:37 ออก เก็บสลิป 01:43 ไว้ และตรวจประวัติสลิปเก่าก่อน ห้ามนำไปอนุมัติอีกโดยยังไม่ตรวจยอด</li></ol>
        <p class="muted">เฉพาะสิทธิ์เต็ม • ห้ามย้ายสลิปที่กำลังตรวจหรือมีบันทึกเติมเงินแล้ว • ทุกการแก้เก็บในชีต DepositSlipLinkAudit • ไม่ต้องส่งสลิปซ้ำหรือโอนเพิ่ม</p></details>`;
      html += "<h3>รายการฝากที่รอตรวจสอบ (" + r.deposits.length + ")</h3>";
      if (adminRole !== "full") html += "<div class='muted'>รหัสผ่านชุดนี้ดูรายละเอียดและการแจ้งเตือนได้ แต่อนุมัติหรือยกเลิกรายการฝาก/ถอนไม่ได้</div>";
      html += "<div class='muted'>ตรวจยอดเงินเข้าจริงในบัญชีธนาคารก่อนเติมเครดิตทุกครั้ง รูปสลิปไม่ใช่หลักฐานยืนยันเงินเข้า และห้ามใช้รายการโอนเดียวกันอนุมัติหลายคำขอ</div>";
      html += r.deposits.map((d, i) => `<div class="card">
        <div class="row"><b>${esc(d.name || "-")}</b><span class="badge">${esc(d.status)}</span></div>
        <div class="row"><span>สมาชิก ${esc(d.memberNumber)}</span><span class="muted">${esc(d.time)}</span></div>
        <div class="row"><span>ยอดที่ลูกค้าเติม</span><span class="amount">${esc(d.netAmount)} บาท</span></div>
        <div class="muted">${esc(d.txId)}</div>
        <div>${(d.slips || []).map(s => `<div class="row"><span>สลิป ${esc(s.time)} | โอน ${esc(s.verification && s.verification.date || "ไม่ทราบ")} | อ้างอิง ${esc(s.verification && s.verification.ref || "ไม่มี")}</span>${slipEditButton(s, d.status === "รอตรวจสอบ" && !d.recoveryAvailable)}</div>`).join("")}</div>
        <div style="margin-top:8px"><b>สลิปที่สมาชิกส่ง (ตรวจเทียบกับคำขอนี้เอง):</b>
          ${(d.slips || []).map(s => `<div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">เปิดสลิป ${esc(s.time)}</a><div class="muted">${esc(s.verification ? s.verification.state + ": " + s.verification.reason : "ยังไม่มีผลตรวจ EasySlip — ตรวจบัญชีธนาคารเอง")}</div>${s.verification && s.verification.ref ? `<div class="muted">อ้างอิง ${esc(s.verification.ref)} / ยอดจากสลิป ${esc(s.verification.amount)} บาท</div>` : ""}${s.verification && s.verification.registeredName !== undefined ? `<div class="muted">ชื่อที่สมัคร: ${esc(s.verification.registeredName || "ไม่พบชื่อ")} / ชื่อผู้โอน: ${esc(s.verification.senderNames && (s.verification.senderNames.th || s.verification.senderNames.en) || "ไม่มีข้อมูล")}</div>` : ""}</div>`).join("") || "<div class='muted'>ยังไม่มีสลิปในระบบ กรุณาตรวจใน LINE OA</div>"}
        </div>
        ${adminRole === "full" && d.recoveryAvailable ? `<div class="muted">รายการนี้มีบันทึกเติมเงินค้าง สามารถตรวจสอบและกู้คืนโดยไม่เติมซ้ำ</div><div style="margin-top:8px"><button class="btn" onclick="walletAct(this,'adminRecoverDeposit','deposits',${i})">🔄 ตรวจสอบ/กู้คืนรายการ</button></div>` : ""}
        ${adminRole === "full" && !d.recoveryAvailable && d.status === "รอตรวจสอบ" ? `<div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn" onclick="walletAct(this,'adminConfirmDeposit','deposits',${i})">✅ ดำเนินการเรียบร้อย (เติมเครดิต)</button>
          <button class="btn red" onclick="walletAct(this,'adminRejectDeposit','deposits',${i})">ยกเลิก</button>
        </div>` : ""}
        ${d.status === "กำลังดำเนินการ" && !d.recoveryAvailable ? "<div class='muted'>ไม่พบบันทึกกู้คืนที่ปลอดภัย กรุณาตรวจยอดและแจ้งผู้ดูแล</div>" : ""}</div>`).join("") || "<div class='muted'>ไม่มีรายการ</div>";
      html += "<h3 style='margin-top:18px'>สลิปที่ยังไม่ได้ผูกกับคำขอ (" + (r.unlinkedSlips || []).length + ")</h3>";
      html += (r.unlinkedSlips || []).map(s => `<div class="row"><span>สมาชิก ${esc(s.memberNumber)} | ${esc(s.time)} ${s.linkStatus === "ADMIN_UNLINKED" ? "(แอดมินแยกไว้ — ไม่ผูกกลับอัตโนมัติ)" : ""}</span>${slipEditButton(s, true)}</div>`).join("");
      html += (r.unlinkedSlips || []).map(s => `<div class="card"><div>สมาชิก ${esc(s.memberNumber)}</div><div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">เปิดสลิป ${esc(s.time)}</a></div><div class="muted">${esc(s.verification ? s.verification.reason : "ยังไม่มีผลตรวจ EasySlip")} — ตรวจยอดกับรายการโอนในบัญชีธนาคารก่อนดำเนินการ</div></div>`).join("") || "<div class='muted'>ไม่มีสลิปที่ตกค้าง</div>";
      html += "<h3 style='margin-top:18px'>รายการถอนที่รอโอน (" + r.withdrawals.length + ")</h3>";
      html += r.withdrawals.map((w, i) => `<div class="card">
        <div class="row"><b>${esc(w.name || "-")}</b><span class="muted">${esc(w.time)}</span></div>
        <div class="row"><span>สมาชิก ${esc(w.memberNumber)}</span><span class="amount">${esc(w.netAmount)} บาท</span></div>
        <div class="row"><span>ธนาคาร: ${esc(w.bank)}</span><span>เลขบัญชี: <b>${esc(w.account)}</b></span></div>
        <div class="muted">${esc(w.txId)} (ระบบหักยอดจากลูกค้าไว้แล้ว)</div>
        ${adminRole === "full" ? `<div style="margin-top:8px"><button class="btn" onclick="walletAct(this,'adminCompleteWithdrawal','withdrawals',${i})">✅ ดำเนินการเรียบร้อย (โอนแล้ว)</button></div>` : ""}
      </div>`).join("") || "<div class='muted'>ไม่มีรายการ</div>";
      box.innerHTML = html;
    } catch (e) { box.innerHTML = ""; setMsg(e.message); }
  }
  async function walletAct(btn, action, list, index) {
    if (adminRole !== "full") return setMsg("ไม่มีสิทธิ์อนุมัติหรือยกเลิกรายการฝาก/ถอน");
    const item = walletData[list][index];
    const txId = item.txId;
    const questions = {
      adminConfirmDeposit: "ตรวจบัญชีธนาคารแล้วว่าเงินเข้า " + item.netAmount + " บาทจริง และรายการโอนนี้ยังไม่เคยเติมเครดิตใช่หรือไม่? ยืนยันเติมเงินให้ " + item.name,
      adminRecoverDeposit: "ตรวจสอบบันทึกและยอดปัจจุบันเพื่อกู้คืนรายการฝากนี้ โดยระบบจะไม่เติมเงินซ้ำใช่หรือไม่?",
      adminRejectDeposit: "ยกเลิกรายการฝากนี้?",
      adminCompleteWithdrawal: "โอนเงิน " + item.netAmount + " บาท ให้ " + item.name + " เรียบร้อยแล้วใช่หรือไม่?"
    };
    if (!confirm(questions[action])) return;
    btn.disabled = true;
    try {
      const r = await api(action, { txId });
      setMsg(r.message, r.status === "success");
      await loadWallet();
    } catch (e) { setMsg(e.message); btn.disabled = false; }
  }

  // ---------- จัดส่งสลาก ----------
  let shippingData = { orders: [], prizeReturns: [] };
  async function loadShipping() {
    const box = $("tab-shipping"); box.innerHTML = "<div class='muted'>กำลังโหลด...</div>";
    try {
      const r = await api("adminGetShipping");
      if (r.status !== "success") { box.innerHTML = ""; return setMsg(r.message); }
      shippingData = r;
      const label = (type, i) => `<button class="btn blue" onclick="printLabel('${type}',${i})">🖨️ พิมพ์ชื่อที่อยู่</button> <button class="btn gray" onclick="copyAddr('${type}',${i})">คัดลอก</button>`;
      let html = "<h3>ลูกค้าซื้อและเลือกรับสลากจริง (" + r.orders.length + ")</h3>";
      html += r.orders.map((o, i) => `<div class="card">
        <div class="row"><b>${esc(o.name)}</b><span class="muted">${esc(o.orderId)}</span></div>
        <div class="row"><span>โทร ${esc(o.phone)}</span><span>สมาชิก ${esc(o.memberNumber)}</span></div>
        <div class="row"><span>ที่อยู่: ${esc(o.address)}</span></div>
        <div class="muted">สลาก: ${esc(o.tickets.join(", "))}</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${label("order", i)}
          ${o.status === "จัดส่งแล้ว" ? `<span class="badge">จัดส่งแล้ว · EMS ${esc(o.ems || "-")}</span>` : `<input id="ems_${i}" placeholder="หมายเลข EMS" style="max-width:200px" oninput="$('emsBtn_${i}').disabled=!this.value.trim()"><button class="btn" id="emsBtn_${i}" disabled onclick="markOrder(this,${i})">✅ ดำเนินการเรียบร้อย</button>`}
        </div></div>`).join("") || "<div class='muted'>ไม่มีรายการ</div>";
      html += "<h3 style='margin-top:18px'>ลูกค้าถูกรางวัลและขอรับสลากจริง (" + r.prizeReturns.length + ")</h3>";
      html += r.prizeReturns.map((o, i) => `<div class="card">
        <div class="row"><b>${esc(o.name)}</b><span class="badge">${esc(o.method)} · ${esc(o.status)}</span></div>
        <div class="row"><span>โทร ${esc(o.phone)}</span><span class="muted">${esc(o.time)}</span></div>
        <div class="row"><span>ที่อยู่: ${esc(o.address || "-")}</span></div>
        <div class="muted">สลาก: ${esc(o.tickets.join(", "))}</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${label("return", i)}
          ${o.status.indexOf("รอ") === 0 ? (o.method === "ส่งไปรษณีย์"
            ? `<input id="rems_${i}" placeholder="หมายเลข EMS" style="max-width:200px" oninput="$('remsBtn_${i}').disabled=!this.value.trim()"><button class="btn" id="remsBtn_${i}" disabled onclick="markReturn(this,${i})">✅ ดำเนินการเรียบร้อย</button>`
            : `<button class="btn" onclick="markReturn(this,${i})">✅ ลูกค้ารับแล้ว</button>`)
            : (o.ems ? `<span class="badge">จัดส่งแล้ว · EMS ${esc(o.ems)}</span>` : "")}
        </div></div>`).join("") || "<div class='muted'>ไม่มีรายการ</div>";
      box.innerHTML = html;
    } catch (e) { box.innerHTML = ""; setMsg(e.message); }
  }
  function shippingItem(type, i) { return type === "order" ? shippingData.orders[i] : shippingData.prizeReturns[i]; }
  function printLabel(type, i) {
    const o = shippingItem(type, i);
    const w = window.open("", "_blank", "width=520,height=420");
    if (!w) return alert("เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต popup");
    w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>ที่อยู่จัดส่ง</title>
      <style>body{font-family:Tahoma,sans-serif;padding:24px;font-size:20px}.box{border:2px solid #000;padding:16px;max-width:460px}</style></head>
      <body><div class="box"><div>ผู้รับ: <b>${esc(o.name)}</b></div><div>โทร: ${esc(o.phone)}</div>
      <div style="margin-top:8px">ที่อยู่: ${esc(o.address)}</div></div>
      <script>window.onload=function(){window.print();}<\/script></body></html>`);
    w.document.close();
  }
  async function copyAddr(type, i) {
    const o = shippingItem(type, i);
    const text = `${o.name}\nโทร ${o.phone}\n${o.address}`;
    try { await navigator.clipboard.writeText(text); setMsg("คัดลอกชื่อที่อยู่แล้ว", true); }
    catch (e) { prompt("คัดลอกข้อความนี้", text); }
  }
  async function markOrder(btn, index) {
    const o = shippingData.orders[index];
    const ems = ($("ems_" + index).value || "").trim();
    if (!ems) return alert("กรุณากรอกหมายเลข EMS ก่อน");
    if (!confirm("ยืนยันจัดส่งออเดอร์ของ " + o.name + " (EMS: " + ems + ") เรียบร้อยแล้ว?")) return;
    btn.disabled = true;
    try { const r = await api("adminSetOrderShipped", { orderId: o.orderId, ems }); setMsg(r.message, r.status === "success"); await loadShipping(); }
    catch (e) { setMsg(e.message); btn.disabled = false; }
  }
  async function markReturn(btn, index) {
    const item = shippingData.prizeReturns[index];
    const requestId = item.requestId;
    const newStatus = item.method === "ส่งไปรษณีย์" ? "จัดส่งแล้ว" : "รับสลากแล้ว";
    let ems = "";
    if (newStatus === "จัดส่งแล้ว") {
      ems = ($("rems_" + index).value || "").trim();
      if (!ems) return alert("กรุณากรอกหมายเลข EMS ก่อน");
    }
    if (!confirm("เปลี่ยนสถานะเป็น \"" + newStatus + "\"" + (ems ? " (EMS: " + ems + ")" : "") + " ?")) return;
    btn.disabled = true;
    try { const r = await api("adminSetReturnStatus", { requestId, newStatus, ems }); setMsg(r.message, r.status === "success"); await loadShipping(); }
    catch (e) { setMsg(e.message); btn.disabled = false; }
  }

  // ---------- Settings ----------
  let settingsOriginal = {};
  async function loadSettings() {
    const box = $("tab-settings"); box.innerHTML = "<div class='muted'>กำลังโหลด...</div>";
    try {
      const r = await api("adminGetSettings");
      if (r.status !== "success") { box.innerHTML = ""; return setMsg(r.message); }
      settingsOriginal = {};
      let html = "<div class='card'><table>";
      r.rows.forEach(row => {
        html += "<tr>";
        row.cells.forEach(c => {
          const key = row.row + "_" + c.col;
          if (c.col === 1) html += `<th style="width:35%">${esc(c.value)}</th>`;
          else if (!c.editable) html += `<td class="readonly">${esc(c.value)}</td>`;
          else {
            settingsOriginal[key] = c.value;
            if (c.options && c.options.length) {
              const opts = c.options.map(o => `<option ${o === c.value ? "selected" : ""}>${esc(o)}</option>`).join("");
              html += `<td><select data-key="${key}">${opts}</select></td>`;
            } else html += `<td><input data-key="${key}" value="${esc(c.value)}"></td>`;
          }
        });
        html += "</tr>";
      });
      html += "</table><div style='margin-top:10px'><button class='btn' onclick='saveSettings(this)'>💾 บันทึกการตั้งค่า</button></div></div>";
      box.innerHTML = html;
    } catch (e) { box.innerHTML = ""; setMsg(e.message); }
  }
  async function saveSettings(btn) {
    const changes = [];
    document.querySelectorAll("#tab-settings [data-key]").forEach(el => {
      if (el.value !== settingsOriginal[el.dataset.key]) {
        const [row, col] = el.dataset.key.split("_").map(Number);
        changes.push({ row, col, value: el.value });
      }
    });
    if (!changes.length) return setMsg("ไม่มีการเปลี่ยนแปลง", true);
    if (!confirm("บันทึกการเปลี่ยนแปลง " + changes.length + " รายการ?")) return;
    btn.disabled = true;
    try { const r = await api("adminSaveSettings", { changes }); setMsg(r.message, r.status === "success"); if (r.status === "success") await loadSettings(); }
    catch (e) { setMsg(e.message); }
    btn.disabled = false;
  }

  async function restoreAdminSession() {
    if (!sessionStorage.getItem(TOKEN_KEY)) return;
    try {
      const r = await api("adminGetSession");
      if (r.status !== "success") return showLogin(r.message || "ตรวจสอบสิทธิ์ไม่สำเร็จ");
      adminRole = r.role;
      showApp();
    } catch (e) { showLogin(e.message); }
  }
  restoreAdminSession();
</script>
</body>
</html>
